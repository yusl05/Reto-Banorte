services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    command: sh -c "npm run seed && npm start"
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URL=mongodb://mongo:27017/banorte_credito
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app:z
      - /app/node_modules

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,z
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z

volumes:
  mongo_data:
