services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - MONGO_URL=mongodb://mongo:27017/banorte_credito
      - FRONTEND_ORIGIN=http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    # The source bind mount reuses the node_modules volume; install here so
    # dependency changes cannot leave a stale volume and a crashed backend.
    command: sh -c "npm install --omit=dev && npm run seed && npm start"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data: